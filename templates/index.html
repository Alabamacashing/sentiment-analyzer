<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Sentiment Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #0f0f1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #667eea; }
        textarea::placeholder { color: #555; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            margin-top: 24px;
            padding: 24px;
            background: #0f0f1a;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .emoji { font-size: 3rem; margin-bottom: 8px; }
        .label { font-size: 1.8rem; font-weight: bold; margin-bottom: 8px; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .confidence { color: #888; font-size: 0.95rem; }
        .loading { text-align: center; color: #888; margin-top: 16px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Sentiment Analyzer</h1>
        <p class="subtitle">Powered by DistilBERT — type any movie review below</p>
        <textarea id="review" placeholder="e.g. This movie was absolutely amazing!..."></textarea>
        <button onclick="analyze()" id="btn">Analyze Review</button>
        <div class="loading" id="loading">⏳ Analyzing...</div>
        <div class="result" id="result">
            <div class="emoji" id="emoji"></div>
            <div class="label" id="label"></div>
            <div class="confidence" id="confidence"></div>
        </div>
    </div>
    <script>
        async function analyze() {
            const review = document.getElementById("review").value;
            if (!review.trim()) { alert("Please enter a movie review!"); return; }
            const btn = document.getElementById("btn");
            const loading = document.getElementById("loading");
            const result = document.getElementById("result");
            btn.disabled = true;
            loading.style.display = "block";
            result.style.display = "none";
            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ review })
                });
                const data = await response.json();
                document.getElementById("emoji").textContent = data.emoji;
                document.getElementById("label").textContent = data.label;
                document.getElementById("label").className = "label " + data.label.toLowerCase();
                document.getElementById("confidence").textContent = `Confidence: ${data.confidence}%`;
                result.style.display = "block";
            } catch (err) {
                alert("Something went wrong. Please try again.");
            } finally {
                btn.disabled = false;
                loading.style.display = "none";
            }
        }
        document.getElementById("review").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); analyze(); }
        });
    </script>
</body>
</html>
